name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -W error -m unittest -v
      - name: Leak check
        env:
          LEAK_EXTRA_TERMS: ${{ secrets.LEAK_EXTRA_TERMS }}
        run: |
          if [ -n "$LEAK_EXTRA_TERMS" ]; then
            python tools/leak_check.py --require-terms
          else
            echo "::warning::secret LEAK_EXTRA_TERMS is not set: running the generic checks only"
            python tools/leak_check.py
          fi
